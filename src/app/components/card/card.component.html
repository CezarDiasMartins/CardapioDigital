<!-- mat-typography --- Angular Material -->
<div class="mat-typography card">
    <mat-card class="example-card" appearance="outlined">
        <img mat-card-image src="{{ img }}" alt="{{ titulo }}">
        <div>
            <mat-card-content>
                <h3 class="titulo">{{ titulo }}</h3>
                <p class="descricao">{{ descricao }}</p>
            </mat-card-content>
            <mat-card-actions class="preco">
                <p>R$ {{ preco }}</p>
            </mat-card-actions>
        </div>
    </mat-card>
    <div class="btnCarrinho" (click)="addAoCarrinho()">
        <img ngSrc="carrinho.avif" alt="carrinho" height="30" width="30">
    </div>
</div>
